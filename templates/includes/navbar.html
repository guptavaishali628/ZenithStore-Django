{% load static %}
<header class="top-bar">
        <div class="container top-bar-content">
            <div class="top-bar-left">
                <div class="dropdown-item">
                    <span>Language</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="dropdown-item">
                    <span>USD</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>
            <div class="top-bar-right">
                <a href="mailto:support@zenithstore.com" class="contact-link">
                    <i class="fa-regular fa-envelope"></i> Email
                </a>
                <a href="tel:+1234567890" class="contact-link">
                    <i class="fa-solid fa-phone"></i> Call us
                </a>
            </div>
        </div>
    </header>

    <!-- 2. MAIN NAVIGATION BAR -->
    <nav class="main-navbar">
        <div class="container navbar-content">
            
            <!-- Brand Logo -->
            <a href="/" class="brand-logo">
                <img src="{% static 'logo.jpeg' %}" alt="ZenithStore Logo" class="logo-img">
                <div class="brand-text">
                    <span class="brand-name">Zenith<span class="gold-text">Store</span></span>
                </div>
            </a>

            <!-- Search & Category Bar -->
            <div class="search-category-wrapper">
                <!-- data-toggle="dropdown" aur dropdown class added-->
                <div class="category-btn dropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="cursor: pointer;">
                    <i class="fa-solid fa-bars"></i>
                    <span>All category</span>
                    <i class="fa-solid fa-chevron-down arrow-down"></i>

                    <!-- Dropdown Menu -->
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="{% url 'store' %}">All Products</a>
                        {% for category in links %}
                            <a class="dropdown-item" href="{{ category.get_url }}">{{ category.category_name }}</a>
                        {% endfor %}
                    </div>
                </div>
                <a href="#" class="store-link-btn">Store</a>
                <form action="#" method="GET" class="search-form">
                    <input type="text" placeholder="Search" name="q" class="search-input">
                    <button type="submit" class="search-submit-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>
            </div>

            <!-- User Auth & Cart -->
            <div class="navbar-actions">
                <div class="user-greeting">
                    <span class="guest-text">Welcome guest!</span>
                    <div class="auth-links">
                        <a href="#">Sign in</a>
                        <span class="pipe">|</span>
                        <a href="#">Register</a>
                    </div>
                </div>

                <a href="#" class="cart-button">
                    <div class="cart-icon-wrapper">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span class="cart-badge">0</span>
                    </div>
                </a>
            </div>

        </div>
    </nav>
