{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenithStore | Modern E-Commerce</title>
    <!-- 1. Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}?v=1">

    {% block extra_css %}
    {% endblock extra_css %}
    
</head>
<body>
    <!-- navbar(include navbar from includes folder) -->
    {% include 'includes/navbar.html' %}
    <!-- page content render here-->
    {% block content %}
    {% endblock content %}

    <!-- Footer(include Footer from includes folder) -->
    {% include 'includes/footer.html' %}

    <!-- Bootstrap Scripts (Collapsible filters ke liye zaroori) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
